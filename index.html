<!DOCTYPE html>
<html>
<script src="script.js"></script>
<head>

  <base target="_top">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Form Management System</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f9;
      color: #222;
    }

    .container {
      width: 95%;
      max-width: 1200px;
      margin: 40px auto;
    }

    .header {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      padding: 25px;
      border-radius: 12px 12px 0 0;
    }

    .header h1 {
      margin-bottom: 5px;
    }

    .header p {
      opacity: 0.9;
    }

    .card {
      background: white;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    /* FORM */

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    select {
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }

    .buttons {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    button {
      border: none;
      padding: 11px 18px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-secondary {
      background: #6b7280;
      color: white;
    }

    .btn-secondary:hover {
      background: #4b5563;
    }

    .btn-edit {
      background: #f59e0b;
      color: white;
    }

    .btn-delete {
      background: #dc2626;
      color: white;
    }

    /* TABLE */

    .table-header {
      margin-top: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .table-header h2 {
      font-size: 20px;
    }

    .search {
      width: 300px;
      max-width: 100%;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th {
      background: #111827;
      color: white;
      padding: 13px;
      text-align: left;
      font-size: 13px;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
    }

    tr:hover {
      background: #f9fafb;
    }

    .status {
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .status-active {
      background: #dcfce7;
      color: #166534;
    }

    .status-inactive {
      background: #fee2e2;
      color: #991b1b;
    }

    .action-buttons {
      display: flex;
      gap: 5px;
    }

    .action-buttons button {
      padding: 7px 10px;
      font-size: 12px;
    }

    /* LOADING */

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
      color: #2563eb;
      font-weight: bold;
    }

    /* MESSAGE */

    #message {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px 20px;
      border-radius: 8px;
      color: white;
      display: none;
      z-index: 9999;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    .success {
      background: #16a34a;
    }

    .error {
      background: #dc2626;
    }

    /* MOBILE */

    @media(max-width: 700px) {

      .container {
        width: 100%;
        margin: 0;
      }

      .header {
        border-radius: 0;
      }

      .card {
        padding: 18px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .table-header {
        flex-direction: column;
        align-items: stretch;
      }

      .search {
        width: 100%;
      }

    }

  </style>

</head>


<body>

<div class="container">

  <div class="header">

    <h1>Form Management System</h1>

    <p>
      Google Apps Script + Google Sheets Database
    </p>

  </div>


  <!-- FORM -->

  <div class="card">

    <form id="recordForm">

      <input type="hidden" id="recordId">

      <div class="form-grid">

        <div class="form-group">

          <label for="name">
            Name *
          </label>

          <input
            type="text"
            id="name"
            placeholder="Enter name"
            required
          >

        </div>


        <div class="form-group">

          <label for="email">
            Email *
          </label>

          <input
            type="email"
            id="email"
            placeholder="Enter email"
            required
          >

        </div>


        <div class="form-group">

          <label for="phone">
            Phone
          </label>

          <input
            type="text"
            id="phone"
            placeholder="Enter phone number"
          >

        </div>


        <div class="form-group">

          <label for="status">
            Status
          </label>

          <select id="status">

            <option value="Active">
              Active
            </option>

            <option value="Inactive">
              Inactive
            </option>

          </select>

        </div>

      </div>


      <div class="buttons">

        <button
          type="submit"
          class="btn-primary"
          id="submitButton"
        >
          Add Record
        </button>

        <button
          type="button"
          class="btn-secondary"
          onclick="resetForm()"
        >
          Clear
        </button>

      </div>

    </form>

  </div>


  <!-- RECORDS -->

  <div class="card">

    <div class="table-header">

      <h2>
        Records
      </h2>

      <input
        type="text"
        class="search"
        id="searchInput"
        placeholder="Search records..."
        onkeyup="searchRecords()"
      >

    </div>


    <div id="loading" class="loading">
      Loading records...
    </div>


    <div class="table-wrapper">

      <table>

        <thead>

          <tr>

            <th>ID</th>

            <th>Name</th>

            <th>Email</th>

            <th>Phone</th>

            <th>Status</th>

            <th>Created</th>

            <th>Actions</th>

          </tr>

        </thead>

        <tbody id="recordTable">

        </tbody>

      </table>

    </div>

  </div>

</div>


<div id="message"></div>


<script>

let records = [];


/**
 * Load records when page opens
 */
window.onload = function() {
  loadRecords();
};


/**
 * READ
 */
function loadRecords() {

  showLoading(true);

  google.script.run

    .withSuccessHandler(function(data) {

      records = data || [];

      renderRecords(records);

      showLoading(false);

    })

    .withFailureHandler(function(error) {

      showLoading(false);

      showMessage(
        error.message,
        "error"
      );

    })

    .getRecords();

}


/**
 * Display records
 */
function renderRecords(data) {

  const table =
    document.getElementById("recordTable");

  table.innerHTML = "";


  if (data.length === 0) {

    table.innerHTML = `
      <tr>
        <td colspan="7"
            style="text-align:center;padding:30px;">
          No records found.
        </td>
      </tr>
    `;

    return;
  }


  data.forEach(function(record) {

    const statusClass =
      record.status === "Active"
      ? "status-active"
      : "status-inactive";


    const row = document.createElement("tr");


    row.innerHTML = `

      <td>${escapeHtml(record.id)}</td>

      <td>${escapeHtml(record.name)}</td>

      <td>${escapeHtml(record.email)}</td>

      <td>${escapeHtml(record.phone)}</td>

      <td>
        <span class="status ${statusClass}">
          ${escapeHtml(record.status)}
        </span>
      </td>

      <td>
        ${escapeHtml(record.createdAt)}
      </td>

      <td>

        <div class="action-buttons">

          <button
            class="btn-edit"
            onclick="editRecord('${escapeJs(record.id)}')"
          >
            Edit
          </button>

          <button
            class="btn-delete"
            onclick="deleteRecord('${escapeJs(record.id)}')"
          >
            Delete
          </button>

        </div>

      </td>

    `;


    table.appendChild(row);

  });

}


/**
 * CREATE / UPDATE
 */
document
  .getElementById("recordForm")
  .addEventListener("submit", function(event) {

    event.preventDefault();


    const id =
      document.getElementById("recordId").value;


    const data = {

      id: id,

      name:
        document.getElementById("name").value.trim(),

      email:
        document.getElementById("email").value.trim(),

      phone:
        document.getElementById("phone").value.trim(),

      status:
        document.getElementById("status").value

    };


    if (!data.name || !data.email) {

      showMessage(
        "Name and email are required.",
        "error"
      );

      return;

    }


    document.getElementById("submitButton").disabled =
      true;


    if (id) {

      // UPDATE

      google.script.run

        .withSuccessHandler(function(response) {

          showMessage(
            response.message,
            "success"
          );

          resetForm();
          loadRecords();

        })

        .withFailureHandler(function(error) {

          showMessage(
            error.message,
            "error"
          );

          document.getElementById(
            "submitButton"
          ).disabled = false;

        })

        .updateRecord(data);


    } else {

      // CREATE

      google.script.run

        .withSuccessHandler(function(response) {

          showMessage(
            response.message,
            "success"
          );

          resetForm();
          loadRecords();

        })

        .withFailureHandler(function(error) {

          showMessage(
            error.message,
            "error"
          );

          document.getElementById(
            "submitButton"
          ).disabled = false;

        })

        .createRecord(data);

    }

  });


/**
 * EDIT
 */
function editRecord(id) {

  const record =
    records.find(function(item) {

      return String(item.id) === String(id);

    });


  if (!record) {

    showMessage(
      "Record not found.",
      "error"
    );

    return;

  }


  document.getElementById("recordId").value =
    record.id;

  document.getElementById("name").value =
    record.name;

  document.getElementById("email").value =
    record.email;

  document.getElementById("phone").value =
    record.phone;

  document.getElementById("status").value =
    record.status;


  document.getElementById("submitButton").textContent =
    "Update Record";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/**
 * DELETE
 */
function deleteRecord(id) {

  const confirmed =
    confirm(
      "Are you sure you want to delete this record?"
    );


  if (!confirmed) {
    return;
  }


  showLoading(true);


  google.script.run

    .withSuccessHandler(function(response) {

      showMessage(
        response.message,
        "success"
      );

      loadRecords();

    })

    .withFailureHandler(function(error) {

      showLoading(false);

      showMessage(
        error.message,
        "error"
      );

    })

    .deleteRecord(id);

}


/**
 * Reset form
 */
function resetForm() {

  document
    .getElementById("recordForm")
    .reset();


  document.getElementById("recordId").value =
    "";


  document.getElementById("status").value =
    "Active";


  document.getElementById("submitButton").textContent =
    "Add Record";


  document.getElementById("submitButton").disabled =
    false;

}


/**
 * Search
 */
function searchRecords() {

  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase();


  const filtered =
    records.filter(function(record) {

      return (

        String(record.id)
          .toLowerCase()
          .includes(search)

        ||

        String(record.name)
          .toLowerCase()
          .includes(search)

        ||

        String(record.email)
          .toLowerCase()
          .includes(search)

        ||

        String(record.phone)
          .toLowerCase()
          .includes(search)

        ||

        String(record.status)
          .toLowerCase()
          .includes(search)

      );

    });


  renderRecords(filtered);

}


/**
 * Loading indicator
 */
function showLoading(show) {

  document.getElementById("loading").style.display =
    show ? "block" : "none";

}


/**
 * Success/error notification
 */
function showMessage(message, type) {

  const element =
    document.getElementById("message");


  element.textContent = message;

  element.className = type;

  element.style.display = "block";


  setTimeout(function() {

    element.style.display = "none";

  }, 3000);

}


/**
 * Protect HTML output
 */
function escapeHtml(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/**
 * Protect values inserted into JS attributes
 */
function escapeJs(value) {

  return String(value)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, '\\"');

}

</script>

</body>

</html>
